<!DOCTYPE html>
<html>
<head>
    <title>Simple Backend Test</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin: 10px 0; padding: 10px; background: #f8f9fa; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>🧪 Simple Backend Test</h1>
    
    <div class="test">
        <h3>Test 1: Backend Health</h3>
        <button onclick="testHealth()">Test Connection</button>
        <div id="health-result" class="result"></div>
    </div>

    <div class="test">
        <h3>Test 2: Random Plants (No Auth Required)</h3>
        <button onclick="testRandomPlants()">Get Random Plants</button>
        <div id="plants-result" class="result"></div>
    </div>

    <div class="test">
        <h3>Test 3: Dashboard Stats (No Auth Required)</h3>
        <button onclick="testStats()">Get Stats</button>
        <div id="stats-result" class="result"></div>
    </div>

    <div class="test">
        <h3>Test 4: View Existing Identifications</h3>
        <button onclick="testIdentifications()">View All Plant IDs</button>
        <div id="ids-result" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';

        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            try {
                const response = await fetch(`${API_BASE}/`);
                const text = await response.text();
                
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `✅ Backend Connected!<br>Response: ${text}`;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ Connection failed: ${error.message}`;
            }
        }

        async function testRandomPlants() {
            const resultDiv = document.getElementById('plants-result');
            try {
                const response = await fetch(`${API_BASE}/api/plants/random/`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `✅ Random Plants API Working!<br><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `❌ API Error: ${JSON.stringify(data)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ Request failed: ${error.message}`;
            }
        }

        async function testStats() {
            const resultDiv = document.getElementById('stats-result');
            try {
                const response = await fetch(`${API_BASE}/api/plants/admin/stats/`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `✅ Stats API Working!<br>
                        <strong>Users:</strong> ${data.stats.total_users}<br>
                        <strong>Identifications:</strong> ${data.stats.total_identifications}<br>
                        <strong>Recent:</strong> ${data.stats.recent_identifications}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `❌ API Error: ${JSON.stringify(data)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ Request failed: ${error.message}`;
            }
        }

        async function testIdentifications() {
            const resultDiv = document.getElementById('ids-result');
            try {
                const response = await fetch(`${API_BASE}/api/plants/admin/identifications/`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    if (data.identifications.length > 0) {
                        resultDiv.innerHTML = `✅ Found ${data.identifications.length} plant identifications!<br><pre>${JSON.stringify(data, null, 2)}</pre>`;
                    } else {
                        resultDiv.innerHTML = `✅ API Working! No plant identifications yet.<br><em>This will show data when mobile app uploads photos.</em>`;
                    }
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `❌ API Error: ${JSON.stringify(data)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ Request failed: ${error.message}`;
            }
        }
    </script>
</body>
</html>
